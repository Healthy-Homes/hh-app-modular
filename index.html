<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthy Homes Practitioner App</title>

  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PDF generation library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-gray-100 text-gray-900 min-h-screen">
  <header class="p-4 bg-green-700 text-white text-xl font-bold">
    <span data-i18n="healthyHomesReport">Healthy Homes Practitioner App</span>
  </header>

  <main class="p-4 space-y-6 max-w-4xl mx-auto">
    <!-- Language Toggle -->
    <section id="language-toggle" class="mb-4 flex justify-end"></section>

    <!-- Consent Section -->
    <section id="consent-block" class="bg-white p-4 rounded shadow space-y-3">
      <h2 class="text-lg font-semibold text-gray-800" data-i18n="resident">Resident Information</h2>
      
      <div>
        <label for="resident-name" id="resident-name-label" class="block text-sm font-medium text-gray-700 mb-1">
          Resident Name
        </label>
        <input 
          id="resident-name" 
          type="text" 
          placeholder="Enter resident name" 
          class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" 
        />
      </div>
      
      <div>
        <label class="flex items-start space-x-3">
          <input type="checkbox" id="consent-checkbox" class="mt-1 text-blue-600" />
          <span id="consent-label" class="text-sm text-gray-700">
            I consent to a home inspection and agree to share information for documentation purposes.
          </span>
        </label>
      </div>
    </section>

    <!-- Checklist Section -->
    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-semibold text-gray-800 mb-4" data-i18n="checklist">Home Inspection Checklist</h2>
      <div id="checklist" class="space-y-2"></div>
    </section>

    <!-- SDOH Section -->
    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-semibold text-gray-800 mb-4" data-i18n="sdoh">Social Determinants of Health</h2>
      <div id="sdoh" class="space-y-4"></div>
    </section>

    <!-- Map Section -->
    <section id="map-section" class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Neighborhood Risk Map</h2>
      <div id="map" class="h-80 w-full rounded border"></div>
    </section>

    <!-- Risk Scoring Toggle -->
    <section id="risk-toggle-section" class="bg-white p-4 rounded shadow">
      <label class="flex items-center space-x-3">
        <input type="checkbox" id="risk-toggle" class="text-blue-600" />
        <span class="text-base font-medium text-gray-800">
          Include risk scoring in this report (display and export)
        </span>
      </label>
    </section>

    <!-- Risk Score Display -->
    <section id="risk-score-output" class="hidden bg-white p-4 rounded shadow space-y-3">
      <h3 class="text-lg font-semibold text-gray-800">Risk Assessment Results</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="text-center p-3 border rounded">
          <div class="text-2xl mb-2">🏠</div>
          <div class="text-sm text-gray-600 mb-1">Home Risk Score</div>
          <div>
            <span id="home-risk" class="px-3 py-1 rounded text-white font-bold text-lg">0</span>
          </div>
          <div id="risk-home-label" class="text-sm font-medium mt-1"></div>
        </div>
        
        <div class="text-center p-3 border rounded">
          <div class="text-2xl mb-2">🌍</div>
          <div class="text-sm text-gray-600 mb-1">Social Risk Score</div>
          <div>
            <span id="sdoh-risk" class="px-3 py-1 rounded text-white font-bold text-lg">0</span>
          </div>
          <div id="risk-sdoh-label" class="text-sm font-medium mt-1"></div>
        </div>
        
        <div class="text-center p-3 border rounded">
          <div class="text-2xl mb-2">⚠️</div>
          <div class="text-sm text-gray-600 mb-1">Total Risk Score</div>
          <div>
            <span id="total-risk" class="px-3 py-1 rounded text-white font-bold text-lg">0</span>
          </div>
          <div id="risk-combined-label" class="text-sm font-medium mt-1"></div>
        </div>
      </div>
    </section>

    <!-- Export Section -->
    <section id="export-buttons" class="bg-white p-4 rounded shadow">
      <button id="export-report" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium transition-colors">
        <span data-i18n="export_button">Export Report</span>
      </button>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
