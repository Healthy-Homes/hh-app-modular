<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthy Homes Practitioner App</title>

  <!-- Optional: Suppress favicon 404 -->
  <link rel="icon" href="data:," />

  <!-- Tailwind for development (remove for production builds) -->
  <script src="https://cdn.tailwindcss.com" defer></script>

  <!-- MapLibre styles -->
  <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- ✅ PDFMake + Unicode font support (deferred load) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfmake-unicode@1.0.3/build/pdfmake.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfmake-unicode@1.0.3/build/vfs_fonts.js" defer></script>

  <!-- ✅ App entry point: Executes AFTER all scripts above -->
  <script type="module" src="js/main.js" defer></script>
</head>

<body class="bg-gray-100 text-gray-900 min-h-screen">
  <header class="p-4 bg-green-700 text-white text-xl font-bold">
    Healthy Homes Practitioner App
  </header>

  <main class="p-4 space-y-6 max-w-4xl mx-auto">

    <!-- Language Toggle -->
    <section id="language-toggle" class="mb-4"></section>

    <!-- Consent Form -->
    <section id="consent-block" class="space-y-2">
      <label data-i18n="resident_name_label" for="resident-name">Resident Name</label><br />
      <input id="resident-name" type="text" class="border p-2 w-full" data-i18n-placeholder="resident_name_placeholder" />

      <label class="block mt-2">
        <input type="checkbox" id="consent-checkbox" class="mr-2" />
        <span data-i18n="consent_text">I consent to a home inspection...</span>
      </label>
    </section>

    <!-- Inspection Checklist -->
    <section id="checklist"></section>

    <!-- SDOH Form -->
    <section id="sdoh-form"></section>

    <!-- Map Section -->
    <section id="map-section" class="mt-4 relative">
      <div id="map" class="h-64 w-full rounded shadow"></div>
    </section>

    <!-- Export Button -->
    <section id="export-buttons">
      <button id="export-btn" class="bg-blue-600 text-white px-4 py-2 rounded" data-i18n="export_button">
        Export Report
      </button>
    </section>

  </main>
</body>
</html>
