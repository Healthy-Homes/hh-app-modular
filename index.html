<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthy Homes Practitioner App</title>

  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com" defer></script>

  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-gray-100 text-gray-900 min-h-screen">
  <header class="p-4 bg-green-700 text-white text-xl font-bold">
    Healthy Homes Practitioner App
  </header>

  <main class="p-4 space-y-6 max-w-4xl mx-auto">
    <section id="language-toggle" class="mb-4"></section>

    <section id="consent-block" class="space-y-2">
      <label for="resident-name" data-i18n="residentNameLabel">Resident Name</label><br/>
      <input id="resident-name" type="text" placeholder="Enter resident name" class="border p-2 w-full" />
      <label class="block mt-2">
        <input type="checkbox" id="consent-checkbox" class="mr-2" />
        <span data-i18n="consentText">I consent to a home inspection and agree to share information for documentation purposes.</span>
      </label>
    </section>

    <section id="checklist"></section>
    <section id="sdoh-form"></section>

    <section id="map-section" class="mt-4 relative">
      <div id="map" class="h-64 w-full rounded shadow"></div>
    </section>

    <section id="risk-toggle-section" class="p-4 mt-4 border rounded bg-gray-50">
      <label class="flex items-center space-x-2">
        <input type="checkbox" id="risk-toggle" class="accent-blue-600" />
        <span data-i18n="riskToggleLabel" class="text-base font-medium">
          Include risk scoring in this report (display and export)
        </span>
      </label>
    </section>

    <section id="risk-score-output" class="hidden mt-4 p-4 border rounded bg-white shadow space-y-2">
      <div>
        <span data-i18n="riskHomeScore"><strong>🏠 Home Risk Score</strong></span>:
        <span id="home-risk" class="ml-2 px-2 py-1 rounded text-white"></span>
        <span id="risk-home-label" class="ml-2 font-semibold"></span>
      </div>
      <div>
        <span data-i18n="riskSDOHScore"><strong>🌍 Social Risk Score</strong></span>:
        <span id="sdoh-risk" class="ml-2 px-2 py-1 rounded text-white"></span>
        <span id="risk-sdoh-label" class="ml-2 font-semibold"></span>
      </div>
      <div>
        <span data-i18n="riskTotalScore"><strong>⚠️ Total Risk Score</strong></span>:
        <span id="total-risk" class="ml-2 px-2 py-1 rounded text-white"></span>
        <span id="risk-combined-label" class="ml-2 font-semibold"></span>
      </div>
    </section>

    <section id="export-buttons">
      <button id="export-report" class="bg-blue-600 text-white px-4 py-2 rounded">
        Export Report
      </button>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
