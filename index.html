<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthy Homes Practitioner App</title>

  <!-- Tailwind CDN for development (not for production use) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MapLibre CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- Optional custom tweaks -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- ✅ PDFMake with CJK font support -->
  <script src="https://cdn.jsdelivr.net/npm/pdfmake-unicode@1.0.3/build/pdfmake.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfmake-unicode@1.0.3/build/vfs_fonts.js"></script>

  <!-- Main JS entry point -->
  <script type="module" src="js/main.js"></script>
</head>

<body class="bg-gray-100 text-gray-900 min-h-screen">
  <header class="p-4 bg-green-700 text-white text-xl font-bold">
    Healthy Homes Practitioner App
  </header>

  <main class="p-4 space-y-6 max-w-4xl mx-auto">

    <!-- Language Toggle Buttons -->
    <section id="language-toggle" class="mb-4"></section>

    <!-- Consent Form Section -->
    <section id="consent-block" class="space-y-2">
      <label data-i18n="resident_name_label" for="resident-name">Resident Name</label><br/>
      <input id="resident-name" type="text" placeholder="" class="border p-2 w-full" data-i18n-placeholder="name_placeholder">

      <label class="block mt-2">
        <input type="checkbox" id="consent-checkbox" class="mr-2">
        <span data-i18n="consent_text">I consent to a home inspection...</span>
      </label>
    </section>

    <!-- Housing Inspection Checklist -->
    <section id="checklist"></section>

    <!-- Social Determinants of Health Questionnaire -->
    <section id="sdoh-form"></section>

    <!-- Map Section -->
    <section id="map-section" class="mt-4 relative">
      <div id="map"></div>
    </section>

    <!-- Export Buttons -->
    <section id="export-buttons">
      <button id="export-btn" class="bg-blue-600 text-white px-4 py-2 rounded" data-i18n="export_button">
        Export Report
      </button>
    </section>

  </main>
</body>
</html>
